name: Build & Test

on:
  push:
    branches: [main, qoder/**]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Format / Analyze / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Engine tests (pure Dart)
        working-directory: packages/sketchglyph_engine
        run: |
          dart pub get
          dart test --coverage=coverage
          dart pub global activate coverage
          dart pub global run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info \
            --packages=.dart_tool/package_config.json --report-on=lib

      - name: Engine coverage summary
        working-directory: packages/sketchglyph_engine
        run: |
          if [ -f coverage/lcov.info ]; then
            lines=$(grep -c "^SF:" coverage/lcov.info || true)
            echo "files covered: $lines"
            awk -F: '/^DA:/ {split($2,a,","); tot++; if (a[2]+0>0) hit++} END {if (tot>0) printf "line coverage: %.1f%%\n", hit*100/tot}' coverage/lcov.info
          fi

      - name: Upload engine coverage
        uses: actions/upload-artifact@v4
        with:
          name: engine-coverage
          path: packages/sketchglyph_engine/coverage/
          if-no-files-found: ignore

      - name: App tests
        run: flutter test --coverage

      - name: Upload app coverage
        uses: actions/upload-artifact@v4
        with:
          name: app-coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sketchglyph-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload visual samples
        uses: actions/upload-artifact@v4
        with:
          name: docs-samples
          path: docs/samples/
          if-no-files-found: ignore

  release:
    name: Release artifacts
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode keystore (CI only)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ github.workspace }}/upload-keystore.jks
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            cat > android/key.properties <<PROPS
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=$KEYSTORE_PATH
          PROPS
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release signing configured."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "NOTE: signing secrets missing -> building with debug signing."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Build app bundle
        run: flutter build appbundle --release

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: sketchglyph-release-apks
          path: build/app/outputs/flutter-apk/*-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: sketchglyph-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*-release.apk
            build/app/outputs/bundle/release/app-release.aab
